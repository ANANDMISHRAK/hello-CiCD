# Workflow name displayed in the GitHub Actions tab.
name: Java CI

# Events that automatically start this workflow.
on:
  # Run when code is pushed to the main branch.
  push:
    branches: [ "main" ]
  # Run when a pull request proposes changes into main.
  pull_request:
    branches: [ "main" ]
  # Add a manual Run workflow button in the Actions tab.
  workflow_dispatch:

# Default permissions are intentionally read-only; give jobs only what they need.
permissions:
  # Allows the workflow to check out repository contents.
  contents: read

# Jobs are independent units of work executed by GitHub-hosted runners.
jobs:
  # First job: compile code, run tests and enforce local quality checks.
  build-test-quality:
    # Friendly name shown in the Actions UI.
    name: Build, tests and static analysis
    # Selects a fresh Ubuntu virtual machine hosted by GitHub.
    runs-on: ubuntu-latest
    # Steps run in order inside this job.
    steps:
      # Downloads the repository source into the runner workspace.
      - name: Checkout source
        uses: actions/checkout@v4

      # Installs Java 17 and enables Maven dependency caching between runs.
      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          # Uses Eclipse Temurin, a common OpenJDK distribution.
          distribution: temurin
          # Must match the project's Java target version.
          java-version: '17'
          # Caches downloaded Maven dependencies to speed up future builds.
          cache: maven

      # Compiles production/test code and executes JUnit/MockMvc/ArchUnit tests.
      - name: Compile and run tests
        run: mvn --batch-mode --no-transfer-progress clean test

      # Runs Maven's later verification phase, including JaCoCo, PMD and Checkstyle checks.
      - name: Verify quality checks
        run: mvn --batch-mode --no-transfer-progress verify

      # Always try to save reports, even if a preceding test/check fails.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Name of the downloadable report bundle on the workflow run page.
          name: test-and-coverage-reports
          # Files/directories to include in the artifact.
          path: |
            target/surefire-reports/
            target/site/jacoco/
          # Do not fail the job only because a report folder was not created.
          if-no-files-found: warn
          # GitHub deletes this workflow artifact after seven days.
          retention-days: 7

  # Second job: scan external dependencies for known vulnerabilities.
  dependency-scan:
    needs: build-test-quality
    # Friendly name shown in the Actions UI.
    name: OWASP dependency vulnerability scan
    # Runs independently on a fresh Ubuntu runner.
    runs-on: ubuntu-latest
    steps:
      # Fetches source code so Maven can read pom.xml.
      - name: Checkout source
        uses: actions/checkout@v4

      # Installs Java and enables the Maven dependency cache.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Invokes OWASP Dependency-Check explicitly; first run may be slow while vulnerability data downloads.
      - name: Run OWASP Dependency-Check
        run: >
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=7
          -DskipTestScope=true

      # Saves the generated report so it can be downloaded from GitHub Actions.
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 7
